<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo C · 宽屏仪表盘</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="min-h-screen lg:grid lg:grid-cols-[240px_1fr]">
    <aside class="border-b border-slate-800 bg-slate-900/80 p-5 lg:border-b-0 lg:border-r">
      <div class="text-lg font-bold tracking-tight">Desk Gateway</div>
      <div class="mt-1 text-xs text-slate-400">device console</div>
      <nav class="mt-8 space-y-1 text-sm">
        <div class="rounded-md bg-slate-800 px-3 py-2 text-white">控制台</div>
        <div class="rounded-md px-3 py-2 text-slate-400">网络</div>
        <div class="rounded-md px-3 py-2 text-slate-400">设置</div>
      </nav>
      <div class="mt-8 space-y-2 text-xs text-slate-500">
        <div>驱动 mxtark</div>
        <div>模式 SIM</div>
        <div id="state">状态 idle</div>
      </div>
    </aside>

    <main class="p-6 lg:p-10">
      <div class="mb-8 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold">升降控制</h1>
          <p id="hint" class="mt-1 text-sm text-slate-400">宽屏三栏信息架构 · 按住运动</p>
        </div>
        <label class="flex items-center gap-2 text-sm text-slate-300">
          <input type="checkbox" class="rounded border-slate-600 bg-slate-900" /> 童锁
        </label>
      </div>

      <div class="grid gap-6 xl:grid-cols-3">
        <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-6 xl:col-span-1">
          <div class="text-xs uppercase tracking-[0.2em] text-slate-500">Height</div>
          <div id="height" class="mt-3 font-mono text-6xl font-bold tracking-tight">95.0</div>
          <div class="text-slate-500">cm</div>
          <div class="mt-8 h-2 overflow-hidden rounded-full bg-slate-800">
            <div id="rail" class="h-full rounded-full bg-cyan-400" style="width:45%"></div>
          </div>
        </div>

        <div class="flex items-center justify-center rounded-2xl border border-slate-800 bg-slate-900/40 p-6 xl:col-span-1">
          <svg class="h-52 w-full max-w-sm" viewBox="0 0 280 180">
            <rect x="20" y="165" width="240" height="8" rx="2" fill="#334155"/>
            <rect x="78" y="70" width="12" height="95" rx="2" fill="#64748b"/>
            <rect x="190" y="70" width="12" height="95" rx="2" fill="#64748b"/>
            <rect id="top" x="40" y="55" width="200" height="16" rx="3" fill="#94a3b8"/>
            <rect x="110" y="24" width="60" height="28" rx="2" fill="#1e293b" stroke="#475569"/>
          </svg>
        </div>

        <div class="flex flex-col gap-3 rounded-2xl border border-slate-800 bg-slate-900/60 p-6 xl:col-span-1">
          <button id="up" class="hold rounded-xl bg-cyan-500 px-4 py-5 text-left font-semibold text-slate-950 hover:bg-cyan-400">
            ▲ 升高 <span class="float-right text-xs font-normal opacity-70">HOLD</span>
          </button>
          <button id="stop" class="rounded-xl border border-rose-500/40 bg-rose-500/10 px-4 py-3 font-medium text-rose-300 hover:bg-rose-500/20">停止</button>
          <button id="down" class="hold rounded-xl border border-slate-700 bg-slate-800 px-4 py-5 text-left font-semibold hover:bg-slate-750">
            ▼ 降低 <span class="float-right text-xs font-normal text-slate-400">HOLD</span>
          </button>
          <div class="mt-2 grid grid-cols-2 gap-2">
            <button data-preset="750" class="rounded-lg border border-slate-700 py-3 text-sm hover:bg-slate-800">档位 1</button>
            <button data-preset="1150" class="rounded-lg border border-slate-700 py-3 text-sm hover:bg-slate-800">档位 4</button>
          </div>
        </div>
      </div>
      <p class="mt-8 text-sm text-slate-500">Demo C：侧栏 + 三栏仪表盘，针对笔记本/显示器全宽，不是手机遥控器。</p>
    </main>
  </div>
  <script src="./demo-logic.js"></script>
</body>
</html>
