<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo A · Home Assistant 风</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f2f4f8] text-slate-800">
  <header class="border-b bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-3">
      <div class="flex items-center gap-3">
        <div class="grid h-9 w-9 place-items-center rounded-md bg-sky-600 text-sm font-bold text-white">DG</div>
        <div>
          <div class="font-semibold">Desk Gateway</div>
          <div class="text-xs text-slate-500">Overview · mxtark</div>
        </div>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <span id="state" class="rounded-full bg-slate-100 px-2.5 py-1 text-slate-600">idle</span>
        <span class="rounded-full bg-amber-100 px-2.5 py-1 text-amber-800">SIM</span>
      </div>
    </div>
  </header>

  <main class="mx-auto grid max-w-6xl gap-6 px-6 py-8 lg:grid-cols-12">
    <section class="lg:col-span-7">
      <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="text-sm text-slate-500">桌面高度</div>
        <div id="height" class="mt-1 text-5xl font-semibold tracking-tight">95.0 <span class="text-2xl font-medium text-slate-400">cm</span></div>
        <p id="hint" class="mt-2 text-sm text-slate-500">按住升/降，松手停止</p>
        <div class="mt-8 flex items-end gap-6">
          <svg class="h-40 w-full max-w-md" viewBox="0 0 280 180">
            <rect x="30" y="160" width="220" height="8" rx="2" fill="#cbd5e1"/>
            <rect class="leg" x="80" y="70" width="12" height="90" rx="2" fill="#94a3b8"/>
            <rect class="leg" x="188" y="70" width="12" height="90" rx="2" fill="#94a3b8"/>
            <rect id="top" x="50" y="58" width="180" height="14" rx="3" fill="#b08968"/>
          </svg>
          <div class="h-40 w-2 overflow-hidden rounded-full bg-slate-200">
            <div id="rail" class="mt-auto h-[45%] w-full rounded-full bg-sky-500" style="margin-top:auto;position:relative;top:55%"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="flex flex-col gap-4 lg:col-span-5">
      <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="mb-3 text-sm font-medium text-slate-500">控制</div>
        <div class="grid gap-3">
          <button id="up" class="hold rounded-lg bg-emerald-600 px-4 py-4 text-left text-white hover:bg-emerald-500">
            <div class="text-lg font-semibold">▲ 升高</div>
            <div class="text-xs text-emerald-100">按住</div>
          </button>
          <button id="stop" class="rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 font-medium text-rose-700 hover:bg-rose-100">停止</button>
          <button id="down" class="hold rounded-lg bg-sky-600 px-4 py-4 text-left text-white hover:bg-sky-500">
            <div class="text-lg font-semibold">▼ 降低</div>
            <div class="text-xs text-sky-100">按住</div>
          </button>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-2">
          <button data-preset="750" class="rounded-lg border border-slate-200 px-3 py-3 text-sm hover:bg-slate-50">档位 1</button>
          <button data-preset="1150" class="rounded-lg border border-slate-200 px-3 py-3 text-sm hover:bg-slate-50">档位 4</button>
        </div>
        <label class="mt-4 flex items-center gap-2 text-sm text-slate-600">
          <input type="checkbox" class="rounded border-slate-300" /> 童锁
        </label>
      </div>
      <div class="rounded-xl border border-dashed border-slate-300 bg-white/70 p-4 text-sm text-slate-500">
        Demo A：Home Assistant 常见的白底卡片 + 功能分区。适合「后台管理」预期。
      </div>
    </section>
  </main>
  <script src="./demo-logic.js"></script>
</body>
</html>
