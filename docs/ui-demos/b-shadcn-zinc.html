<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo B · Shadcn / Zinc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            border: '#27272a',
            ring: '#3f3f46',
            background: '#09090b',
            foreground: '#fafafa',
            muted: '#a1a1aa',
            card: '#09090b',
            primary: '#fafafa',
            accent: '#27272a',
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-50 antialiased">
  <div class="mx-auto max-w-6xl px-6 py-8">
    <header class="mb-8 flex flex-wrap items-end justify-between gap-4 border-b border-zinc-800 pb-6">
      <div>
        <p class="text-sm text-zinc-500">desk-gateway / control</p>
        <h1 class="mt-1 text-3xl font-semibold tracking-tight">Desk Gateway</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="state" class="inline-flex h-7 items-center rounded-md border border-zinc-800 bg-zinc-900 px-2.5 text-xs text-zinc-300">idle</span>
        <span class="inline-flex h-7 items-center rounded-md border border-amber-900/50 bg-amber-950 px-2.5 text-xs text-amber-200">SIM</span>
        <button class="inline-flex h-9 items-center rounded-md border border-zinc-800 px-3 text-sm text-zinc-300 hover:bg-zinc-900">童锁</button>
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-2">
      <div class="rounded-xl border border-zinc-800 bg-zinc-950 p-6 shadow-sm">
        <p class="text-sm text-zinc-500">Height</p>
        <p id="height" class="mt-2 text-6xl font-semibold tracking-tighter">95.0<span class="ml-2 text-2xl font-medium text-zinc-500">cm</span></p>
        <p id="hint" class="mt-3 text-sm text-zinc-500">Press & hold to move · release to stop</p>
        <div class="mt-10 flex items-end gap-4">
          <svg class="h-44 w-full" viewBox="0 0 280 180">
            <rect x="30" y="160" width="220" height="6" rx="2" fill="#3f3f46"/>
            <rect x="80" y="70" width="10" height="90" rx="2" fill="#52525b"/>
            <rect x="190" y="70" width="10" height="90" rx="2" fill="#52525b"/>
            <rect id="top" x="50" y="58" width="180" height="12" rx="2" fill="#a1a1aa"/>
          </svg>
          <div class="relative h-44 w-1.5 overflow-hidden rounded-full bg-zinc-800">
            <div id="rail" class="absolute bottom-0 w-full rounded-full bg-zinc-100" style="height:45%"></div>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-3 rounded-xl border border-zinc-800 p-6">
        <button id="up" class="hold inline-flex h-16 items-center justify-between rounded-md bg-zinc-50 px-5 text-zinc-950 hover:bg-white">
          <span class="text-base font-medium">Raise</span>
          <span class="text-xs text-zinc-500">hold</span>
        </button>
        <button id="stop" class="inline-flex h-11 items-center justify-center rounded-md border border-zinc-800 text-sm hover:bg-zinc-900">Stop</button>
        <button id="down" class="hold inline-flex h-16 items-center justify-between rounded-md border border-zinc-800 px-5 hover:bg-zinc-900">
          <span class="text-base font-medium">Lower</span>
          <span class="text-xs text-zinc-500">hold</span>
        </button>
        <div class="mt-2 grid grid-cols-2 gap-2">
          <button data-preset="750" class="inline-flex h-11 items-center justify-center rounded-md border border-zinc-800 text-sm hover:bg-zinc-900">Preset 1</button>
          <button data-preset="1150" class="inline-flex h-11 items-center justify-center rounded-md border border-zinc-800 text-sm hover:bg-zinc-900">Preset 4</button>
        </div>
        <p class="mt-auto pt-4 text-xs text-zinc-600">Demo B：模拟 shadcn/ui + zinc 暗色。若选这套，固件侧会用 Vite+React+真 shadcn 落地。</p>
      </div>
    </div>
  </div>
  <script src="./demo-logic.js"></script>
</body>
</html>
