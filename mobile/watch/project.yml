# XcodeGen specification for the standalone watchOS validation app.
name: DeskGatewayWatch

options:
  bundleIdPrefix: com.dong4j.deskgateway
  deploymentTarget:
    watchOS: "11.0"

packages:
  DeskGatewayWatchCore:
    path: .

targets:
  DeskGatewayWatch:
    type: application
    platform: watchOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Desk Gateway
        NSBluetoothAlwaysUsageDescription: Desk Gateway 需要通过蓝牙连接升降桌网关。
        NSAppTransportSecurity:
          # 只允许 `.local` 和局域网 IP 的 HTTP，不关闭全局 ATS。
          NSAllowsLocalNetworking: true
        WKApplication: true
        WKWatchOnly: true
    dependencies:
      - package: DeskGatewayWatchCore
        product: DeskGatewayWatchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dong4j.deskgateway.watch
        PRODUCT_NAME: Desk Gateway
        DEVELOPMENT_TEAM: 8WCUMGCWMB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  DeskGatewayWatch:
    build:
      targets:
        DeskGatewayWatch: all
    run:
      config: Debug
